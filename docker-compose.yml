# Postgres local para desarrollo. El 5433 ya lo usa house-gys-db, por eso 5434.
#   pnpm db:up    -> levanta la base
#   pnpm db:down  -> la apaga (los datos quedan en el volumen)
services:
  db:
    image: postgres:16
    container_name: gym-app-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gym_app
    ports:
      - "5434:5432"
    volumes:
      - gym-app-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gym_app"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gym-app-db-data:
